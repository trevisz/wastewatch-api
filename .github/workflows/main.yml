name: CI/CD WasteWatch API


on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      
      run: mvn clean package -DskipTests 

  
  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Staging
      run: echo "Efetuando deploy no ambiente de STAGING (Homologação)..."

  
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      run: echo "Efetuando deploy no ambiente de PRODUÇÃO..."